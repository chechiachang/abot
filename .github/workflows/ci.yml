name: Go

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(git ls-files '*.go')
          test -z "$(gofmt -l $files)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /tmp/abot ./cmd/abot
