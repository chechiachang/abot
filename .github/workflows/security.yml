name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan Go dependencies and code
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-version-input: ""

  gosec:
    name: Go security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run gosec
        uses: securego/gosec@v2.22.2
        with:
          args: ./...
