name: Security
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks history (redacted)
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Compose security invariants
        run: python3 scripts/check-security.py
      - name: Example tools and protocols
        run: python3 -B -m unittest discover -s tests -v
      - name: Trivy configuration and secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --scanners misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /repo
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - hashicorp/vault:2.2.1
          - ghcr.io/dexidp/dex:v2.46.1
          - cr.agentgateway.dev/agentgateway:v1.7.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Trivy runtime image vulnerabilities
        env:
          IMAGE: ${{ matrix.image }}
        run: >-
          docker run --rm -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro"
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --ignorefile /.trivyignore.yaml "$IMAGE"
  demo-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build example runtime
        run: |
          docker build -t agentgateway-playground-examples:local examples
          docker save -o "$RUNNER_TEMP/demo-image.tar" agentgateway-playground-examples:local
      - name: Scan example runtime
        run: >-
          docker run --rm -v "$RUNNER_TEMP/demo-image.tar:/image.tar:ro"
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
