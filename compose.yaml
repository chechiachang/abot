services:
  abot:
    image: ghcr.io/chechiachang/abot:${ABOT_VERSION:-latest}
    build:
      context: .
    init: true
    user: "10001:10001"
    env_file:
      - .env
    environment:
      ABOT_RUNTIME_SQLITE_PATH: /data/state.sqlite
      ABOT_MEDIA_ROOT: /data/media
      ABOT_URL_BROWSER: chromium
    command:
      - --config
      - /config/config.yaml
      - --system-file
      - /config/SYSTEM.md
      - --coding-workdir
      - /workspace
      - telegram
      - serve
    volumes:
      - abot-data:/data
      - ${ABOT_WORKDIR:-.}:/workspace
      - ${ABOT_CONFIG_FILE:-./config.example.yaml}:/config/config.yaml:ro
      - ${ABOT_SYSTEM_FILE:-./SYSTEM.md}:/config/SYSTEM.md:ro
    healthcheck:
      test: ["CMD", "abot", "--config", "/config/config.yaml", "--system-file", "/config/SYSTEM.md", "--coding-workdir", "/workspace", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  abot-data:
