azure:
  base_url: https://myopenai.openai.azure.com/openai/v1
  model: my-deployment
  max_retries: 2
  timeout: 90s
coding:
  workdir: .
  command_timeout: 2m
  max_output_bytes: 65536
instructions:
  system_file: SYSTEM.md
  soul_file: SOUL.md
log:
  level: info
logfire:
  endpoint: https://logfire-api.pydantic.dev/v1/traces
telegram:
  admin_chat_id: 0
  allowed_user_ids: []
  admin_user_ids: []
  default_group_id: 0
  approved_channel_ids: []
capabilities:
  global:
    tools: [read, bash, edit, write, read_url_content, read_quotes]
    mcp: [chrome-devtools, firecrawl]
    thinking_levels: [none, low, medium, high]
  defaults:
    tools: [read, bash, edit, write, read_url_content, read_quotes]
    mcp: []
mcp:
  connections:
    - name: chrome-devtools
      transport: stdio
      command: npx
      args: ["-y", "chrome-devtools-mcp@latest"]
      timeout: 45s
      max_retries: 1
    - name: firecrawl
      transport: stdio
      command: npx
      args: ["-y", "firecrawl-mcp"]
      environment: [FIRECRAWL_API_KEY]
      timeout: 45s
      max_retries: 1
# Connection settings only; R2 upload/sharing is not implemented yet.
r2:
  endpoint: https://664e4225fa00f97af165b5562ae199a9.r2.cloudflarestorage.com
  bucket: abot-share
  region: auto
  presign_expiry: 1h
media:
  max_bytes: 10485760
  max_duration: 5m
  max_pages: 50
  max_extract_bytes: 1048576
  retention: 720h
  pandoc: pandoc
  pdfinfo: pdfinfo
  pdftotext: pdftotext
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  whisper: ""
  whisper_model: ""
  youtube_dl: ""
url_reader:
  timeout: 30s
  max_bytes: 10485760
  max_output_bytes: 12288
  max_redirects: 5
  browser: ""
  firecrawl_external_transfer: false
