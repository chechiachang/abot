# Optional System One selector; model is the Azure deployment name.
# Supply credentials only through ABOT_SYSTEM_ONE_API_KEY.
system_one:
  enabled: false
  endpoint: https://myopenai.openai.azure.com/providers/microsoft/v1/systemone
  model: decision-1
  min_confidence: 0.6
azure:
  base_url: https://myopenai.openai.azure.com/openai/v1
  model: gpt-6-luna
  max_retries: 2
  timeout: 90s
coding:
  workdir: .
  command_timeout: 2m
  max_output_bytes: 65536
instructions:
  system_file: SYSTEM.md
  soul_file: SOUL.md
log:
  level: info
runtime:
  # Maximum duration for one agent run, including coordinator and coding sub-agent work.
  turn_timeout: 20m
logfire:
  endpoint: https://logfire-api.pydantic.dev/v1/traces
telegram:
  # R2 inline preference in UTF-16 units; offload always above 3500.
  response_inline_threshold: 3500
  admin_chat_id: 0
  allowed_user_ids: []
  admin_user_ids: []
  default_group_id: 0
  approved_channel_ids: []
capabilities:
  global:
    # Azure deployment names; include azure.model as the fallback.
    models: [gpt-6-luna, gpt-6.1-sol]
    tools: [read, bash, edit, write, read_url_content, read_quotes]
    mcp: [chrome-devtools, firecrawl]
    thinking_levels: [medium, xhigh]
  defaults:
    tools: [read, bash, edit, write, read_url_content, read_quotes]
    mcp: []
mcp:
  connections:
    - name: chrome-devtools
      transport: stdio
      command: npx
      args: ["-y", "chrome-devtools-mcp@latest"]
      timeout: 45s
      max_retries: 1
    - name: firecrawl
      transport: stdio
      command: npx
      args: ["-y", "firecrawl-mcp"]
      environment: [FIRECRAWL_API_KEY]
      timeout: 45s
      max_retries: 1
# Private long-response storage; enabled only when both R2 credentials are set.
r2:
  endpoint: https://664e4225fa00f97af165b5562ae199a9.r2.cloudflarestorage.com
  bucket: abot-share
  region: auto
  presign_expiry: 168h
  max_bytes: 5242880
media:
  max_bytes: 10485760
  max_duration: 5m
  max_pages: 50
  max_extract_bytes: 1048576
  retention: 720h
  pandoc: pandoc
  pdfinfo: pdfinfo
  pdftotext: pdftotext
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  whisper: ""
  whisper_model: ""
  youtube_dl: ""
url_reader:
  timeout: 30s
  max_bytes: 10485760
  max_output_bytes: 12288
  max_redirects: 5
  browser: ""
  firecrawl_external_transfer: false
